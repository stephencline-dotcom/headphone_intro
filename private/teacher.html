<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headphone Heroes - Teacher</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell teacher-shell">
    <header class="app-header">
      <h1>Headphone Heroes</h1>
      <p>Teacher Controls</p>
    </header>

    <section class="teacher-panel">

      <div class="teacher-dashboard">

        <div class="teacher-dashboard-top">
          <div class="teacher-status">
            <strong>Loading...</strong>
            <span>Connecting to classroom...</span>
          </div>

          <div class="teacher-connection-card">
            <span class="teacher-connection-dot"></span>
            <div>
              <strong>Classroom</strong>
              <span id="teacher-connection-text">Connecting...</span>
            </div>
          </div>
        </div>

        <div class="teacher-dashboard-middle">
          <div class="classroom-controls">
            <label class="control-toggle">
              <span>
                <strong>Teacher Control</strong>
                <small>Teacher controls the lesson pace</small>
              </span>
              <input id="teacher-control-toggle" type="checkbox">
            </label>

            <label class="control-toggle freeze-toggle">
              <span>
                <strong>Freeze Screen</strong>
                <small>Student screens wait for teacher</small>
              </span>
              <input id="freeze-toggle" type="checkbox">
            </label>
          </div>

          <section class="settings-panel">
            <h2>Saved Settings</h2>

            <label class="control-toggle">
              <span>
                <strong>Teacher Control Default</strong>
                <small>Start future lessons in teacher-controlled mode</small>
              </span>
              <input id="default-teacher-control" type="checkbox">
            </label>

            <label class="control-toggle">
              <span>
                <strong>Spoken Directions</strong>
                <small>Use spoken lesson directions by default</small>
              </span>
              <input id="spoken-directions-setting" type="checkbox">
            </label>

            <div id="settings-save-status" class="settings-save-status">
              Loading saved settings...
            </div>
          </section>
        </div>

        <section class="classroom-links-panel">
          <div>
            <strong>Classroom Links</strong>
            <small>Open the lesson display or copy the student link.</small>
          </div>

          <div class="classroom-link-actions">
            <button id="open-presentation-button" type="button">
              Open Presentation
            </button>

            <button id="copy-student-link-button" type="button">
              Copy Student Link
            </button>
          </div>

          <span id="classroom-link-status" class="classroom-link-status"></span>
        </section>

        <div class="teacher-dashboard-bottom">
          <div class="lesson-actions">
            <button id="start-lesson-button" type="button">
              Start Lesson
            </button>

            <button id="reset-lesson-button" type="button">
              Reset Lesson
            </button>
          </div>

          <div class="teacher-controls">
            <button type="button" disabled>Back</button>
            <button type="button" disabled>Next</button>
          </div>
        </div>

      </div>

    </section>

    <footer class="status-bar">
      <span class="status-dot"></span>
      Teacher Screen
    </footer>
  </main>

  <script src="/lesson-data.js"></script>
  <script src="/lesson-engine.js"></script>
  <script src="/classroom-state.js"></script>
  <script src="/classroom-bootstrap.js"></script>
  <script src="/teacher.js"></script>
</body>
</html>
