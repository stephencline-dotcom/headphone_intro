<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headphone Heroes - Teacher</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell teacher-shell">
    <header class="app-header">
      <h1>Headphone Heroes</h1>
      <p>Teacher Controls</p>
    </header>

    <section class="teacher-panel">
      <div class="teacher-status">
        <strong>Foundation Ready</strong>
        <span>Classroom controls will be added next.</span>
      </div>

      <section class="settings-panel">
        <h2>Saved Settings</h2>

        <label class="control-toggle">
          <span>
            <strong>Teacher Control Default</strong>
            <small>Start future lessons in teacher-controlled mode</small>
          </span>
          <input id="default-teacher-control" type="checkbox">
        </label>

        <label class="control-toggle">
          <span>
            <strong>Spoken Directions</strong>
            <small>Use spoken lesson directions by default</small>
          </span>
          <input id="spoken-directions-setting" type="checkbox">
        </label>

        <div id="settings-save-status" class="settings-save-status">
          Loading saved settings...
        </div>
      </section>

      <div class="teacher-controls">
        <button type="button" disabled>Back</button>
        <button type="button" disabled>Next</button>
      </div>
    </section>

    <footer class="status-bar">
      <span class="status-dot"></span>
      Teacher Screen
    </footer>
  </main>

  <script src="/lesson-data.js"></script>
  <script src="/lesson-engine.js"></script>
  <script src="/classroom-state.js"></script>
  <script src="/classroom-bootstrap.js"></script>
  <script src="/teacher.js"></script>
</body>
</html>
