<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headphone Heroes - Presentation</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell presentation-shell">
    <header class="app-header">
      <h1>Headphone Heroes</h1>
    </header>


    <section
      class="presentation-freeze-bar"
      aria-label="Student freeze controls"
    >
      <div class="presentation-freeze-status">
        <span class="presentation-freeze-dot"></span>
        <strong id="presentation-freeze-status">
          UNLOCKED
        </strong>
      </div>

      <div class="presentation-freeze-actions">
        <button
          id="presentation-freeze"
          type="button"
        >
          ❄ Freeze
        </button>

        <button
          id="presentation-stop-catching"
          type="button"
        >
          🔓 Unfrozen Only
        </button>

        <button
          id="presentation-unlock-all"
          type="button"
        >
          🔓 Unlock All
        </button>
      </div>
    </section>

    <section
      id="presentation-lesson-stage"
      class="student-stage"
      aria-live="polite">
    </section>

    <nav class="presentation-controls" aria-label="Lesson controls">
      <button id="presentation-teacher" type="button">
        Teacher Controls
      </button>

      <div class="presentation-step-controls">
        <button id="presentation-back" type="button">
          Back
        </button>

        <button id="presentation-next" type="button">
          Next
        </button>
      </div>
    </nav>
  </main>

  <script src="/lesson-data.js"></script>
  <script src="/lesson-engine.js"></script>
  <script src="/classroom-state.js"></script>
  <script src="/classroom-bootstrap.js"></script>
  <script src="/present.js"></script>
</body>
</html>
